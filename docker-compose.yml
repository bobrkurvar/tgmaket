services:
  bot:
    #image: service-showcase-bot
    build:
      context: .
      dockerfile: Dockerfile
      target: bot

    env_file:
      - .env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432

      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - internal

    restart: unless-stopped


  postgres:
    image: postgres:16-alpine

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - pgdata:/var/lib/postgresql/data

    networks:
      - internal

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

    restart: unless-stopped


  redis:
    image: redis:7-alpine

    networks:
      - internal

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

    restart: unless-stopped


  migrate:
    #image: service-showcase-migrate
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate

    profiles:
      - tools

    env_file:
      - .env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - internal

    restart: "no"


networks:
  internal:
    driver: bridge


volumes:
  pgdata: